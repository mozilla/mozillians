<div class="control-group photo {% if errors %}error{% endif %}">
    {{ label }}
    <div class="controls">
        <input class="input-file" id="id_photo" type="file" name="phtoto">
        {% if errors %}
        <span class="help-inline">{{ errors }}</span>
        {% endif %}
        <p class="help-block">
          <div class="thumbnail">
            {% set img = thumbnail(bf_raw.form.initial['photo'].file, '400x400', crop="center", default="img/unknown.png") %}
            <img id="profile-photo" src="{{ img.url }}" alt="{{ _('Profile photo') }}">
          </div>
        </p>
        <label class="checkbox">
            <input type="checkbox" name="photo_delete" id="id_photo_delete">
            {{ _('Remove Profile Photo') }}
        </label>
    </div>

</div><!-- /clearfix -->
