language: python
sudo: false
python:
  - "2.7.11"
services:
  - elasticsearch
before_script:
  - mysql -e 'create database mozillians character set utf8; SET @@GLOBAL.wait_timeout=28800;'
  - cp mozillians/settings/local.py-travis mozillians/settings/local.py
cache:
  - pip
install:
  - npm install -g less
  - pip install coverage tox
env:
  - TOX_ENV=flake8
  - TOX_ENV=tests
script:
  - tox -e $TOX_ENV
after_success:
  - coveralls
